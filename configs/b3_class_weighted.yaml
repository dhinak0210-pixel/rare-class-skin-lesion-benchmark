# Arm B3: EfficientNet-B0 + Class-Weighted Loss
base_config: "configs/base_config.yaml"
arm_id: "B3"
experiment_name: "arm_b3_class_weighted"
description: "Fine-tuned EfficientNet-B0 with classical augmentation and cost-sensitive class-weighted cross-entropy loss (weights = N / (C * N_c))."

model:
  family: "cnn"
  backbone: "efficientnet_b0"
  pretrained: true
  dropout: 0.2
  num_classes: 7

training:
  batch_size: 32
  epochs: 25
  lr: 0.0003
  weight_decay: 1.0e-4

loss:
  type: "weighted_ce"
  weight_scheme: "balanced" # N / (C * N_c)

sampler:
  type: "standard"

augmentation:
  type: "classical"
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 45
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
