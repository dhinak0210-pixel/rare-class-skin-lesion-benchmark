# Arm B2: EfficientNet-B0 + Balanced Sampler / Oversampling
base_config: "configs/base_config.yaml"
arm_id: "B2"
experiment_name: "arm_b2_balanced_sampler"
description: "Fine-tuned EfficientNet-B0 with classical augmentation plus balanced sampling (inverse class frequency sampling weights via WeightedRandomSampler)."

model:
  family: "cnn"
  backbone: "efficientnet_b0"
  pretrained: true
  dropout: 0.2
  num_classes: 7

training:
  batch_size: 32
  epochs: 25
  lr: 0.0003
  weight_decay: 1.0e-4

loss:
  type: "cross_entropy"

sampler:
  type: "balanced" # Inverse-frequency weighted random sampler

augmentation:
  type: "classical"
  horizontal_flip: true
  vertical_flip: true
  rotation_degrees: 45
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
